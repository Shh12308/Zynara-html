<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeloxAi API Tester</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg-deep: #0a0c0f;
    --bg: #0f1217;
    --bg-raised: #161b22;
    --bg-surface: #1c222b;
    --bg-hover: #242d3a;
    --border: #2a3342;
    --border-focus: #e8a032;
    --fg: #e6edf5;
    --fg-muted: #7d8a9a;
    --fg-dim: #4a5567;
    --accent: #e8a032;
    --accent-glow: rgba(232, 160, 50, 0.15);
    --accent-dim: #b37a1e;
    --success: #3fb950;
    --success-bg: rgba(63, 185, 80, 0.1);
    --error: #f85149;
    --error-bg: rgba(248, 81, 73, 0.1);
    --warning: #d29922;
    --warning-bg: rgba(210, 153, 34, 0.1);
    --info: #58a6ff;
    --info-bg: rgba(88, 166, 255, 0.1);
    --search-card-bg: #1a2130;
    --radius: 8px;
    --radius-lg: 12px;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Space Grotesk', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--sans);
    background: var(--bg-deep);
    color: var(--fg);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background atmosphere */
  body::before {
    content: '';
    position: fixed;
    top: -40%; left: -20%;
    width: 80%; height: 80%;
    background: radial-gradient(ellipse, rgba(232, 160, 50, 0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -30%; right: -10%;
    width: 60%; height: 60%;
    background: radial-gradient(ellipse, rgba(88, 166, 255, 0.03) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--fg-dim); }

  /* Layout */
  .app { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }

  /* Header */
  header {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.5px;
    white-space: nowrap;
  }
  .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), #f0c060);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #0a0c0f;
    font-weight: 800;
  }

  .url-bar {
    flex: 1;
    max-width: 700px;
    display: flex;
    align-items: center;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .url-bar:focus-within { border-color: var(--accent); }
  .url-bar .prefix {
    padding: 0 10px;
    color: var(--fg-dim);
    font-family: var(--mono);
    font-size: 12px;
    user-select: none;
    white-space: nowrap;
  }
  .url-bar input {
    flex: 1;
    background: none;
    border: none;
    color: var(--fg);
    font-family: var(--mono);
    font-size: 13px;
    padding: 8px 4px 8px 0;
    outline: none;
    min-width: 0;
  }
  .url-bar .connect-btn {
    padding: 8px 16px;
    background: var(--accent);
    color: #0a0c0f;
    border: none;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .url-bar .connect-btn:hover { background: #f0b040; }
  .url-bar .connect-btn.connected { background: var(--success); }

  .header-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--fg-muted);
    white-space: nowrap;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--fg-dim);
    transition: background 0.3s;
  }
  .status-dot.online { background: var(--success); box-shadow: 0 0 8px rgba(63,185,80,0.4); }
  .status-dot.error { background: var(--error); box-shadow: 0 0 8px rgba(248,81,73,0.4); }

  /* Main layout */
  .main-layout {
    flex: 1;
    display: grid;
    grid-template-columns: 260px 1fr 380px;
    gap: 0;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    background: var(--bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-section {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-section:last-child { border-bottom: none; }
  .sidebar-title {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--fg-dim);
    margin-bottom: 10px;
  }

  .endpoint-list { display: flex; flex-direction: column; gap: 2px; }
  .endpoint-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--fg-muted);
    transition: all 0.15s;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: var(--sans);
  }
  .endpoint-item:hover { background: var(--bg-hover); color: var(--fg); }
  .endpoint-item.active { background: var(--accent-glow); color: var(--accent); }
  .endpoint-item .method {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    min-width: 40px;
    text-align: center;
    flex-shrink: 0;
  }
  .method-get { background: var(--info-bg); color: var(--info); }
  .method-post { background: var(--success-bg); color: var(--success); }
  .method-delete { background: var(--error-bg); color: var(--error); }

  /* Params panel in sidebar */
  .params-panel { flex: 1; overflow-y: auto; padding: 0; }
  .param-group { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .param-group-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--fg-muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .param-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 8px;
  }
  .param-row:last-child { margin-bottom: 0; }
  .param-label {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--fg-dim);
  }
  .param-input, .param-select, .param-textarea {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 6px 8px;
    color: var(--fg);
    font-family: var(--mono);
    font-size: 12px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  .param-input:focus, .param-select:focus, .param-textarea:focus { border-color: var(--accent); }
  .param-select { cursor: pointer; }
  .param-textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
  .param-checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .param-checkbox-row input[type="checkbox"] {
    accent-color: var(--accent);
    width: 14px;
    height: 14px;
  }
  .param-checkbox-row label {
    font-size: 12px;
    color: var(--fg-muted);
    cursor: pointer;
  }

  /* Center: Request/Response */
  .center-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg-deep);
  }

  .request-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .request-method {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 5px;
    flex-shrink: 0;
  }
  .request-path {
    flex: 1;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--fg-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .send-btn {
    padding: 7px 20px;
    background: var(--accent);
    color: #0a0c0f;
    border: none;
    border-radius: 6px;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .send-btn:hover { background: #f0b040; transform: translateY(-1px); }
  .send-btn:active { transform: translateY(0); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .send-btn .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(10,12,15,0.3);
    border-top-color: #0a0c0f;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: none;
  }
  .send-btn.loading .spinner { display: block; }
  .send-btn.loading .btn-text { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .response-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .response-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--fg-dim);
  }
  .response-empty i { font-size: 48px; opacity: 0.3; }
  .response-empty p { font-size: 14px; }

  /* Message bubbles */
  .msg-bubble {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: var(--radius-lg);
    font-size: 14px;
    line-height: 1.7;
    word-break: break-word;
    animation: msgIn 0.25s ease-out;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-user {
    align-self: flex-end;
    background: var(--accent);
    color: #0a0c0f;
    border-bottom-right-radius: 4px;
    font-weight: 500;
  }
  .msg-ai {
    align-self: flex-start;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg-ai img {
    max-width: 100%;
    border-radius: 8px;
    margin: 8px 0;
  }
  .msg-ai pre {
    background: var(--bg-deep);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    overflow-x: auto;
    margin: 8px 0;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.5;
  }
  .msg-ai code {
    font-family: var(--mono);
    font-size: 13px;
  }
  .msg-ai p { margin-bottom: 8px; }
  .msg-ai p:last-child { margin-bottom: 0; }
  .msg-ai ul, .msg-ai ol { margin: 8px 0; padding-left: 24px; }
  .msg-ai h1, .msg-ai h2, .msg-ai h3 {
    margin: 12px 0 6px;
    font-weight: 700;
  }
  .msg-ai h1 { font-size: 20px; }
  .msg-ai h2 { font-size: 17px; }
  .msg-ai h3 { font-size: 15px; }
  .msg-ai table {
    border-collapse: collapse;
    margin: 8px 0;
    width: 100%;
    font-size: 13px;
  }
  .msg-ai th, .msg-ai td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }
  .msg-ai th { background: var(--bg-hover); font-weight: 600; }
  .msg-ai a { color: var(--accent); text-decoration: none; }
  .msg-ai a:hover { text-decoration: underline; }
  .msg-ai blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 12px;
    margin: 8px 0;
    color: var(--fg-muted);
  }

  /* Search results in chat */
  .search-sources-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 10px 14px;
    background: var(--bg-hover);
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 13px;
    color: var(--fg-muted);
  }
  .source-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--info);
    text-decoration: none;
    font-size: 11px;
    transition: background 0.15s;
  }
  .source-chip:hover { background: var(--bg-raised); }
  .source-chip-img { width: 14px; height: 14px; border-radius: 3px; }
  .search-card {
    display: flex;
    gap: 12px;
    padding: 10px 14px;
    background: var(--search-card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    text-decoration: none;
    color: inherit;
    transition: background 0.15s;
    margin-bottom: 6px;
  }
  .search-card:hover { background: var(--bg-hover); }
  .search-thumb { width: 80px; height: 60px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .search-info { flex: 1; min-width: 0; }
  .search-title { font-size: 13px; font-weight: 600; color: var(--fg); margin-bottom: 3px; }
  .search-link {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--fg-dim);
    margin-bottom: 4px;
  }
  .search-link-favicon { width: 12px; height: 12px; }
  .search-snippet { font-size: 12px; color: var(--fg-muted); line-height: 1.4; }

  /* Image progress bar */
  .image-progress-wrap {
    align-self: flex-start;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 12px;
    width: fit-content;
  }
  .image-progress-bar-track {
    width: 256px;
    height: 4px;
    background: var(--bg-deep);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .image-progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #f0c060);
    border-radius: 2px;
    transition: width 0.15s;
    width: 0%;
  }
  .image-progress-label {
    font-size: 11px;
    color: var(--fg-dim);
    font-family: var(--mono);
  }

  /* Typing indicator */
  .typing-indicator {
    display: flex;
    gap: 4px;
    padding: 12px 16px;
    align-self: flex-start;
  }
  .typing-indicator span {
    width: 6px; height: 6px;
    background: var(--fg-dim);
    border-radius: 50%;
    animation: typingBounce 1.2s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* Right panel: Raw/Debug */
  .right-panel {
    background: var(--bg);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .right-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .right-tab {
    flex: 1;
    padding: 10px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--fg-dim);
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .right-tab:hover { color: var(--fg-muted); }
  .right-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .right-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  .right-content pre {
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.6;
    color: var(--fg-muted);
    white-space: pre-wrap;
    word-break: break-all;
  }

  .meta-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 12px;
    font-size: 12px;
  }
  .meta-key {
    font-family: var(--mono);
    color: var(--fg-dim);
    font-weight: 500;
  }
  .meta-val {
    font-family: var(--mono);
    color: var(--fg);
  }
  .meta-val.success { color: var(--success); }
  .meta-val.error { color: var(--error); }

  /* Toast */
  .toast-container {
    position: fixed;
    top: 72px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .toast {
    padding: 10px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: toastIn 0.3s ease-out;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    max-width: 360px;
  }
  .toast.success { background: #1a3324; border: 1px solid var(--success); color: var(--success); }
  .toast.error { background: #331a1a; border: 1px solid var(--error); color: var(--error); }
  .toast.info { background: #1a2533; border: 1px solid var(--info); color: var(--info); }
  .toast.warning { background: #332a1a; border: 1px solid var(--warning); color: var(--warning); }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(40px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* File upload area */
  .file-upload-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--fg-dim);
    font-size: 12px;
  }
  .file-upload-zone:hover { border-color: var(--accent); color: var(--fg-muted); }
  .file-upload-zone.has-file { border-color: var(--success); color: var(--success); }
  .file-upload-zone i { font-size: 20px; margin-bottom: 6px; display: block; }
  .file-upload-zone input { display: none; }

  /* Rate limit banner */
  .rate-limit-banner {
    padding: 8px 16px;
    background: var(--warning-bg);
    border-bottom: 1px solid var(--warning);
    font-size: 12px;
    color: var(--warning);
    display: none;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .rate-limit-banner.visible { display: flex; }

  /* Responsive */
  @media (max-width: 1100px) {
    .main-layout { grid-template-columns: 220px 1fr 300px; }
  }
  @media (max-width: 860px) {
    .main-layout { grid-template-columns: 1fr; }
    .sidebar, .right-panel { display: none; }
  }
  @media (max-width: 600px) {
    header { padding: 0 12px; }
    .url-bar .prefix { display: none; }
    .header-status { display: none; }
    .response-area { padding: 12px; }
  }

  /* Cursor blink for streaming */
  .cursor-blink::after {
    content: '▊';
    color: var(--accent);
    animation: blink 0.8s step-end infinite;
    font-size: 14px;
    margin-left: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Conv list */
  .conv-list { display: flex; flex-direction: column; gap: 2px; }
  .conv-item {
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--fg-muted);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .conv-item:hover { background: var(--bg-hover); color: var(--fg); }
  .conv-item.active { background: var(--accent-glow); color: var(--accent); }
  .conv-item .conv-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .conv-item .conv-del {
    opacity: 0;
    background: none;
    border: none;
    color: var(--error);
    cursor: pointer;
    font-size: 11px;
    padding: 2px 4px;
    transition: opacity 0.15s;
  }
  .conv-item:hover .conv-del { opacity: 1; }

  /* New chat button */
  .new-chat-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    background: var(--accent-glow);
    border: 1px dashed var(--accent-dim);
    color: var(--accent);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
    font-family: var(--sans);
    margin-bottom: 6px;
  }
  .new-chat-btn:hover { background: rgba(232,160,50,0.2); }
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<script>
// ══════════════════════════════════════════
// State
// ══════════════════════════════════════════
const state = {
  connected: false,
  serverInfo: null,
  activeEndpoint: 'chat',
  activeConvId: null,
  loading: false,
  abortController: null,
  sseLog: [],
  requestMeta: null,
  requestBody: null,
  rawResponse: null,
  uploadedFile: null,
  currentStreamBubble: null,
  currentStreamText: '',
  imageProgressWrap: null,
};

// ══════════════════════════════════════════
// Endpoint Definitions
// ══════════════════════════════════════════
const endpoints = [
  { id: 'chat',     method: 'POST',   path: '/ask/universal',         label: 'Universal Chat' },
  { id: 'newchat',  method: 'POST',   path: '/newchat',              label: 'New Chat' },
  { id: 'analysis', method: 'POST',   path: '/analysis',             label: 'File Analysis' },
  { id: 'chats',    method: 'GET',    path: '/chats',                label: 'List Chats' },
  { id: 'messages', method: 'GET',    path: '/chat/{id}/messages',   label: 'Get Messages' },
  { id: 'delete',   method: 'DELETE', path: '/chats/{id}',           label: 'Delete Chat' },
  { id: 'tts',      method: 'POST',   path: '/tts',                  label: 'Text-to-Speech' },
  { id: 'stt',      method: 'POST',   path: '/stt',                  label: 'Speech-to-Text' },
];

// ══════════════════════════════════════════
// Init
// ══════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  renderEndpoints();
  renderParams();
  // Auto-connect if URL looks populated
  const url = getBaseUrl();
  if (url && url !== 'heloxai2.onrender.com') {
    testConnection();
  }
});

// ══════════════════════════════════════════
// Helpers
// ══════════════════════════════════════════
function getBaseUrl() {
  const raw = document.getElementById('apiUrl').value.trim();
  if (!raw) return '';
  let url = raw;
  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    url = 'https://' + url;
  }
  return url.replace(/\/+$/, '');
}

function methodClass(m) {
  return 'method-' + m.toLowerCase();
}

function toast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icons = { success: 'fa-check-circle', error: 'fa-times-circle', info: 'fa-info-circle', warning: 'fa-exclamation-triangle' };
  el.innerHTML = `<i class="fa-solid ${icons[type] || icons.info}"></i><span>${msg}</span>`;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(40px)'; el.style.transition = 'all 0.3s'; }, 3000);
  setTimeout(() => el.remove(), 3400);
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function formatJson(obj) {
  try { return JSON.stringify(obj, null, 2); }
  catch { return String(obj); }
}

function simpleMarkdown(text) {
  // Code blocks
  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    return `<pre><code class="lang-${lang}">${escapeHtml(code.trim())}</code></pre>`;
  });
  // Inline code
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Headers
  text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  text = text.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // Blockquote
  text = text.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
  // Unordered lists
  text = text.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
  text = text.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
  // Ordered lists
  text = text.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // Links
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // Paragraphs
  text = text.replace(/\n\n/g, '</p><p>');
  text = text.replace(/\n/g, '<br>');
  if (!text.startsWith('<')) text = '<p>' + text + '</p>';
  return text;
}

// ══════════════════════════════════════════
// Render Endpoints List
// ══════════════════════════════════════════
function renderEndpoints() {
  const list = document.getElementById('endpointList');
  list.innerHTML = endpoints.map(ep => `
    <button class="endpoint-item ${ep.id === state.activeEndpoint ? 'active' : ''}"
            data-id="${ep.id}" onclick="selectEndpoint('${ep.id}')">
      <span class="method ${methodClass(ep.method)}">${ep.method}</span>
      <span>${ep.label}</span>
    </button>
  `).join('');
}

function selectEndpoint(id) {
  state.activeEndpoint = id;
  renderEndpoints();
  renderParams();
  updateRequestBar();
}

function updateRequestBar() {
  const ep = endpoints.find(e => e.id === state.activeEndpoint);
  if (!ep) return;
  document.getElementById('reqMethod').textContent = ep.method;
  document.getElementById('reqMethod').className = 'request-method ' + methodClass(ep.method);
  let path = ep.path;
  if (state.activeConvId) {
    path = path.replace('{id}', state.activeConvId);
  }
  document.getElementById('reqPath').textContent = path;
}

// ══════════════════════════════════════════
// Render Params Panel
// ══════════════════════════════════════════
function renderParams() {
  const panel = document.getElementById('paramsPanel');
  let html = '';

  switch (state.activeEndpoint) {
    case 'chat':
      html = `
        <div class="param-group">
          <div class="param-group-title">Chat Parameters</div>
          <div class="param-row">
            <label class="param-label">prompt *</label>

          <div class="param-row">
            <label class="param-label">model</label>
            <select class="param-select" id="p_model">
              <option value="helox" selected>helox (Groq Llama 3.3 70B)</option>
              <option value="chatgpt">chatgpt (OpenAI GPT-4o-mini)</option>
              <option value="chatz">chatz (Groq Llama 3.3 70B)</option>
            </select>
          </div>
          <div class="param-row">
            <label class="param-label">mode</label>
            <select class="param-select" id="p_mode">
              <option value="general" selected>general</option>
              <option value="research">research</option>
              <option value="finance">finance</option>
              <option value="web">web</option>
            </select>
          </div>
          <div class="param-row">
            <label class="param-label">image_size</label>
            <select class="param-select" id="p_imgsize">
              <option value="1024x1024" selected>1024x1024</option>
              <option value="1536x1024">1536x1024 (landscape)</option>
              <option value="1024x1536">1024x1536 (portrait)</option>
            </select>
          </div>
          <div class="param-row">
            <label class="param-label">image_quality</label>
            <select class="param-select" id="p_imgqual">
              <option value="low">low</option>
              <option value="medium" selected>medium</option>
              <option value="high">high</option>
            </select>
          </div>
          <div class="param-checkbox-row">
            <input type="checkbox" id="p_stream" checked>
            <label for="p_stream">Stream response</label>
          </div>
          <div class="param-checkbox-row">
            <input type="checkbox" id="p_remember" checked>
            <label for="p_remember">Remember session</label>
          </div>
        </div>
      `;
      break;

    case 'newchat':
      html = `
        <div class="param-group">
          <div class="param-group-title">New Chat</div>
          <div class="param-row">
            <label class="param-label">title</label>
            <input class="param-input" id="p_title" placeholder="Chat title (optional)" value="Test Chat">
          </div>
          <div class="param-checkbox-row">
            <input type="checkbox" id="p_remember" checked>
            <label for="p_remember">Remember session</label>
          </div>
        </div>
      `;
      break;

    case 'analysis':
      html = `
        <div class="param-group">
          <div class="param-group-title">File Analysis</div>
          <div class="file-upload-zone" id="fileZone" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <div id="fileLabel">Click to upload file (image, code, document)</div>
            <input type="file" id="fileInput" onchange="handleFileSelect(event)">
          </div>
          <div class="param-row" style="margin-top:10px;">
            <label class="param-label">prompt (optional)</label>
            <textarea class="param-textarea" id="p_prompt" placeholder="Specific question about the file..."></textarea>
          </div>
          <div class="param-row">
            <label class="param-label">analysis_type</label>
            <select class="param-select" id="p_astype">
              <option value="" selected>Auto-detect</option>
              <option value="image">Image</option>
              <option value="code">Code</option>
              <option value="document">Document</option>
            </select>
          </div>
          <div class="param-checkbox-row">
            <input type="checkbox" id="p_stream" checked>
            <label for="p_stream">Stream response</label>
          </div>
          <div class="param-checkbox-row">
            <input type="checkbox" id="p_remember" checked>
            <label for="p_remember">Remember session</label>
          </div>
        </div>
      `;
      break;

    case 'chats':
      html = `
        <div class="param-group">
          <div class="param-group-title">List Chats</div>
          <p style="font-size:12px;color:var(--fg-dim);">No parameters required. Uses session cookies for auth.</p>
        </div>
      `;
      break;

    case 'messages':
      html = `
        <div class="param-group">
          <div class="param-group-title">Get Messages</div>
          <div class="param-row">
            <label class="param-label">conversation_id</label>
            <input class="param-input" id="p_convid" placeholder="UUID or select from list" value="${state.activeConvId || ''}">
          </div>
          <p style="font-size:11px;color:var(--fg-dim);margin-top:6px;">Tip: Select a conversation from the list to auto-fill this.</p>
        </div>
      `;

    case 'delete':
      html = `
        <div class="param-group">
          <div class="param-group-title">Delete Chat</div>
          <div class="param-row">

          </div>
          <p style="font-size:11px;color:var(--error);margin-top:6px;"><i class="fa-solid fa-triangle-exclamation"></i> This action cannot be undone.</p>
        </div>
      `;
      break;

    case 'tts':
      html = `
        <div class="param-group">
          <div class="param-group-title">Text-to-Speech</div>
          <div class="param-row">
            <label class="param-label">text *</label>
            <textarea class="param-textarea" id="p_text" placeholder="Text to speak...">Hello! This is a test of the HeloxAi text to speech system.</textarea>
          </div>

            <select class="param-select" id="p_voice">
              <option value="alloy" selected>alloy</option>
              <option value="echo">echo</option>
              <option value="fable">fable</option>
              <option value="onyx">onyx</option>
              <option value="nova">nova</option>
              <option value="shimmer">shimmer</option>

        </div>
      `;

    case 'stt':

        <div class="param-group">
          <div class="param-group-title">Speech-to-Text</div>

}

function handleFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  state.uploadedFile = file;
  const zone = document.getElementById('fileZone');
  zone.classList.add('has-file');
  document.getElementById('fileLabel').textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
}

function handleAudioSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  state.uploadedFile = file;
  const zone = document.getElementById('audioZone');
  zone.classList.add('has-file');
  document.getElementById('audioLabel').textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
}

// ══════════════════════════════════════════
// Right Panel Tabs
// ══════════════════════════════════════════
function switchRightTab(btn) {
  document.querySelectorAll('.right-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderRightContent(btn.dataset.tab);
}

function renderRightContent(tab) {
  const el = document.getElementById('rightContent');
  switch (tab) {
    case 'meta':
      if (!state.requestMeta) {
        el.innerHTML = '<pre style="color:var(--fg-dim);">No request made yet.</pre>';
      } else {
        const m = state.requestMeta;
        el.innerHTML = `<div class="meta-grid">
          <span class="meta-key">Status</span>
          <span class="meta-val ${m.status < 400 ? 'success' : 'error'}">${m.status} ${m.statusText}</span>
          <span class="meta-key">Time</span>
          <span class="meta-val">${m.duration}ms</span>
          <span class="meta-key">Type</span>
          <span class="meta-val">${m.contentType || '—'}</span>
          <span class="meta-key">Size</span>
          <span class="meta-val">${m.size || '—'}</span>
          <span class="meta-key">Rate Limit</span>
          <span class="meta-val">${m.rateLimit || '—'}</span>
          <span class="meta-key">Remaining</span>
          <span class="meta-val">${m.rateRemaining || '—'}</span>
          <span class="meta-key">Reset</span>
          <span class="meta-val">${m.rateReset || '—'}</span>
        </div>`;
      }
      break;
    case 'request':
      if (!state.requestBody) {
        el.innerHTML = '<pre style="color:var(--fg-dim);">No request body.</pre>';
      } else {
        el.innerHTML = `<pre>${escapeHtml(typeof state.requestBody === 'string' ? state.requestBody : formatJson(state.requestBody))}</pre>`;
      }
      break;
    case 'response':
      if (!state.rawResponse) {
        el.innerHTML = '<pre style="color:var(--fg-dim);">No response yet.</pre>';
      } else {
        el.innerHTML = `<pre>${escapeHtml(typeof state.rawResponse === 'string' ? state.rawResponse : formatJson(state.rawResponse))}</pre>`;
      }
      break;
    case 'sse':
      if (state.sseLog.length === 0) {
        el.innerHTML = '<pre style="color:var(--fg-dim);">No SSE events received.</pre>';
      } else {
        el.innerHTML = state.sseLog.map((entry, i) => {
          const color = entry.type === 'error' ? 'var(--error)' : entry.type === 'image' ? 'var(--accent)' : 'var(--fg-muted)';
          return `<pre style="color:${color};margin-bottom:4px;padding-bottom:4px;border-bottom:1px solid var(--border);"><span style="color:var(--fg-dim);">#${i + 1}</span> ${escapeHtml(entry.raw)}</pre>`;
        }).join('');
      }
      break;
  }
}

function updateRightMeta(resp, startTime) {
  const dur = Date.now() - startTime;
  const ct = resp.headers.get('content-type') || '';
  let size = '—';
  // We can't easily get size from streaming, skip
  state.requestMeta = {
    status: resp.status,
    statusText: resp.statusText,
    duration: dur,
    contentType: ct,
    size: size,
    rateLimit: resp.headers.get('x-ratelimit-limit'),
    rateRemaining: resp.headers.get('x-ratelimit-remaining'),
    rateReset: resp.headers.get('x-ratelimit-reset'),
  };

  // Rate limit banner
  const retryAfter = resp.headers.get('retry-after');
  if (resp.status === 429) {
    const banner = document.getElementById('rateLimitBanner');
    document.getElementById('rateLimitText').textContent = `Rate limited. Retry after ${retryAfter || '?'} seconds.`;
    banner.classList.add('visible');
    setTimeout(() => banner.classList.remove('visible'), 10000);
  } else {
    document.getElementById('rateLimitBanner').classList.remove('visible');
  }

  // Auto-refresh active tab
  const activeTab = document.querySelector('.right-tab.active');
  if (activeTab) renderRightContent(activeTab.dataset.tab);
}

// ══════════════════════════════════════════
// Connection Test
// ══════════════════════════════════════════
async function testConnection() {
  const btn = document.getElementById('connectBtn');
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');

  btn.textContent = '...';
  btn.disabled = true;
  dot.className = 'status-dot';
  txt.textContent = 'Connecting...';

  try {
    const base = getBaseUrl();
    const resp = await fetch(base + '/', {
      method: 'GET',
      credentials: 'include',
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const data = await resp.json();
    state.connected = true;
    state.serverInfo = data;

    dot.className = 'status-dot online';
    txt.textContent = `${data.service || 'Connected'} v${data.version || '?'}`;
    btn.textContent = 'Connected';
    btn.classList.add('connected');
    btn.disabled = false;

    toast(`Connected to ${data.service} v${data.version}`, 'success');

    // Show server info
    const area = document.getElementById('responseArea');
    area.innerHTML = `
      <div style="max-width:500px;">
        <h2 style="font-size:20px;font-weight:700;margin-bottom:12px;color:var(--fg);">Server Info</h2>
        <pre style="background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;padding:16px;font-size:12px;line-height:1.6;overflow-x:auto;">${escapeHtml(formatJson(data))}</pre>
        ${data.features ? `<div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;">
          ${data.features.map(f => `<span style="font-size:11px;padding:3px 8px;background:var(--accent-glow);color:var(--accent);border-radius:20px;border:1px solid var(--accent-dim);">${f}</span>`).join('')}
        </div>` : ''}
      </div>
    `;
    state.rawResponse = data;
    renderRightContent('response');

    // Load conversations
    loadConversations();

  } catch (err) {
    state.connected = false;
    dot.className = 'status-dot error';
    txt.textContent = 'Failed';
    btn.textContent = 'Connect';
    btn.classList.remove('connected');
    btn.disabled = false;
    toast(`Connection failed: ${err.message}`, 'error');
  }
}

// ══════════════════════════════════════════
// Load Conversations
// ══════════════════════════════════════════
async function loadConversations() {
  try {
    const base = getBaseUrl();
    const resp = await fetch(base + '/chats', { credentials: 'include' });
    if (!resp.ok) return;
    const data = await resp.json();
    const convs = data.conversations || data.data || data || [];
    renderConvList(convs);
  } catch (e) {
    console.warn('Failed to load conversations:', e);
  }
}

function renderConvList(convs) {
  const el = document.getElementById('convList');
  if (!convs || convs.length === 0) {
    el.innerHTML = '<div style="font-size:12px;color:var(--fg-dim);padding:4px 0;">No conversations</div>';
    return;
  }
  el.innerHTML = convs.map(c => `
    <div class="conv-item ${c.id === state.activeConvId ? 'active' : ''}" onclick="selectConv('${c.id}', '${escapeHtml((c.title || 'Untitled').replace(/'/g, "\\'"))}')">
      <span class="conv-title">${escapeHtml(c.title || 'Untitled')}</span>
      <button class="conv-del" onclick="event.stopPropagation();deleteConvInline('${c.id}')" title="Delete">
        <i class="fa-solid fa-trash"></i>
      </button>
    </div>
  `).join('');
}

function selectConv(id, title) {
  state.activeConvId = id;
  renderConvList([]);
  loadConversations();
  updateRequestBar();
  // If on messages endpoint, auto-fill
  const convInput = document.getElementById('p_convid');
  if (convInput) convInput.value = id;
  const chatInput = document.getElementById('p_chatid');
  if (chatInput) chatInput.value = id;
  toast(`Selected: ${title}`, 'info');
}

async function deleteConvInline(id) {
  try {
    const base = getBaseUrl();
    const resp = await fetch(base + '/chats/' + id, { method: 'DELETE', credentials: 'include' });
    if (resp.ok) {
      if (state.activeConvId === id) state.activeConvId = null;
      toast('Chat deleted', 'success');
      loadConversations();
      updateRequestBar();
    } else {
      toast('Failed to delete', 'error');
    }
  } catch (e) {
    toast('Delete failed: ' + e.message, 'error');
  }
}

// ══════════════════════════════════════════
// Send Request
// ══════════════════════════════════════════
async function sendRequest() {
  if (state.loading) {
    // Abort
    if (state.abortController) state.abortController.abort();
    return;
  }

  const base = getBaseUrl();
  if (!base) { toast('Enter an API URL', 'warning'); return; }

  const ep = endpoints.find(e => e.id === state.activeEndpoint);
  if (!ep) return;

  let path = ep.path;
  if (state.activeEndpoint === 'messages') {
    const cid = document.getElementById('p_convid')?.value?.trim();
    if (!cid) { toast('Enter a conversation_id', 'warning'); return; }
    path = path.replace('{id}', cid);
  } else if (state.activeEndpoint === 'delete') {
    const cid = document.getElementById('p_chatid')?.value?.trim();
    if (!cid) { toast('Enter a chat_id', 'warning'); return; }
    path = path.replace('{id}', cid);
  }

  const url = base + path;
  const startTime = Date.now();
  state.sseLog = [];
  state.rawResponse = null;
  state.currentStreamBubble = null;
  state.currentStreamText = '';
  state.imageProgressWrap = null;

  // Build request
  let options = { method: ep.method, credentials: 'include' };
  state.requestBody = null;

  switch (state.activeEndpoint) {
    case 'chat': {
      const prompt = document.getElementById('p_prompt')?.value?.trim();
      if (!prompt) { toast('Enter a prompt', 'warning'); return; }
      const body = {
        prompt,
        model: document.getElementById('p_model')?.value || 'helox',
        mode: document.getElementById('p_mode')?.value || 'general',
        stream: document.getElementById('p_stream')?.checked ?? true,
        remember: document.getElementById('p_remember')?.checked ?? true,
        image_size: document.getElementById('p_imgsize')?.value || '1024x1024',
        image_quality: document.getElementById('p_imgqual')?.value || 'medium',
      };
      if (state.activeConvId) body.conversation_id = state.activeConvId;
      options.headers = { 'Content-Type': 'application/json' };
      options.body = JSON.stringify(body);
      state.requestBody = body;
      break;
    }
    case 'newchat': {
      const title = document.getElementById('p_title')?.value?.trim() || 'New Chat';
      const remember = document.getElementById('p_remember')?.checked ?? true;
      options.headers = { 'Content-Type': 'application/json' };
      const body = { title, remember };
      options.body = JSON.stringify(body);
      state.requestBody = body;
      break;
    }
    case 'analysis': {
      if (!state.uploadedFile) { toast('Upload a file first', 'warning'); return; }
      const formData = new FormData();
      formData.append('file', state.uploadedFile);
      const prompt = document.getElementById('p_prompt')?.value?.trim();
      if (prompt) formData.append('prompt', prompt);
      const astype = document.getElementById('p_astype')?.value;
      if (astype) formData.append('analysis_type', astype);
      formData.append('stream', document.getElementById('p_stream')?.checked ?? true);
      formData.append('remember', document.getElementById('p_remember')?.checked ?? true);
      if (state.activeConvId) formData.append('conversation_id', state.activeConvId);
      options.body = formData;
      state.requestBody = `[FormData: file="${state.uploadedFile.name}", prompt="${prompt || ''}"]`;
      break;
    }
    case 'tts': {
      const text = document.getElementById('p_text')?.value?.trim();
      if (!text) { toast('Enter text to speak', 'warning'); return; }
      const voice = document.getElementById('p_voice')?.value || 'alloy';
      options.headers = { 'Content-Type': 'application/json' };
      const body = { text, voice };
      options.body = JSON.stringify(body);
      state.requestBody = body;
      break;
    }
    case 'stt': {
      if (!state.uploadedFile) { toast('Upload an audio file', 'warning'); return; }
      const formData = new FormData();
      formData.append('file', state.uploadedFile);
      options.body = formData;
      state.requestBody = `[FormData: audio="${state.uploadedFile.name}"]`;
      break;
    }
    // GET / DELETE have no body
  }

  // UI: set loading
  state.loading = true;
  state.abortController = new AbortController();
  options.signal = state.abortController.signal;
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.classList.add('loading');
  sendBtn.querySelector('.btn-text').innerHTML = '<i class="fa-solid fa-stop"></i> Stop';

  const area = document.getElementById('responseArea');
  const emptyState = document.getElementById('emptyState');
  if (emptyState) emptyState.remove();

  // For chat: show user bubble
  if (state.activeEndpoint === 'chat') {
    const prompt = document.getElementById('p_prompt')?.value?.trim();
    if (prompt) {
      const userBubble = document.createElement('div');
      userBubble.className = 'msg-bubble msg-user';
      userBubble.textContent = prompt;
      area.appendChild(userBubble);
    }
  }

  try {
    const resp = await fetch(url, options);
    updateRightMeta(resp, startTime);

    if (resp.status === 429) {
      const errData = await resp.json().catch(() => ({}));
      state.rawResponse = errData;
      renderRightContent('response');
      toast(errData.detail || 'Rate limited', 'warning');
      return;
    }

    const ct = resp.headers.get('content-type') || '';

    // Handle TTS audio
    if (state.activeEndpoint === 'tts' && ct.includes('audio')) {
      const blob = await resp.blob();
      const audioUrl = URL.createObjectURL(blob);
      const audioEl = document.createElement('div');
      audioEl.className = 'msg-bubble msg-ai';
      audioEl.innerHTML = `<div style="display:flex;align-items:center;gap:10px;"><i class="fa-solid fa-volume-high" style="color:var(--accent);font-size:20px;"></i><div><div style="font-weight:600;margin-bottom:6px;">Audio Response</div><audio controls src="${audioUrl}" style="width:260px;height:36px;"></audio></div></div>`;
      area.appendChild(audioEl);
      area.scrollTop = area.scrollHeight;
      toast('Audio received', 'success');
      return;
    }

    // Handle SSE streaming
    if (ct.includes('text/event-stream') || (options.body && JSON.parse(options.body || '{}').stream === true && resp.body)) {
      await handleSSEStream(resp, area);
      return;
    }

    // Handle regular JSON
    const data = await resp.json().catch(() => null);
    state.rawResponse = data;

    if (!resp.ok) {
      toast(`Error ${resp.status}: ${data?.detail || 'Unknown error'}`, 'error');
      const errEl = document.createElement('div');
      errEl.className = 'msg-bubble msg-ai';
      errEl.style.borderColor = 'var(--error)';
      errEl.innerHTML = `<div style="color:var(--error);font-weight:600;margin-bottom:4px;">Error ${resp.status}</div><pre style="font-size:12px;">${escapeHtml(formatJson(data))}</pre>`;
      area.appendChild(errEl);
    } else {
      // Handle newchat response
      if (state.activeEndpoint === 'newchat') {
        const convId = data.conversation_id || data.id;
        if (convId) {
          state.activeConvId = convId;
          toast(`Chat created: ${convId.substring(0, 8)}...`, 'success');
          loadConversations();
          updateRequestBar();
        }
        const okEl = document.createElement('div');
        okEl.className = 'msg-bubble msg-ai';
        okEl.innerHTML = `<div style="color:var(--success);font-weight:600;margin-bottom:4px;"><i class="fa-solid fa-check-circle"></i> Chat Created</div><pre style="font-size:12px;">${escapeHtml(formatJson(data))}</pre>`;
        area.appendChild(okEl);
      }
      // Handle delete
      else if (state.activeEndpoint === 'delete') {
        toast('Chat deleted', 'success');
        const okEl = document.createElement('div');
        okEl.className = 'msg-bubble msg-ai';
        okEl.innerHTML = `<div style="color:var(--success);font-weight:600;"><i class="fa-solid fa-check-circle"></i> Deleted</div><pre style="font-size:12px;">${escapeHtml(formatJson(data))}</pre>`;
        area.appendChild(okEl);
        if (state.activeConvId === document.getElementById('p_chatid')?.value) {
          state.activeConvId = null;
        }
        loadConversations();
        updateRequestBar();
      }
      // Handle chats list
      else if (state.activeEndpoint === 'chats') {
        const convs = data.conversations || data.data || data || [];
        renderConvList(convs);
        const listEl = document.createElement('div');
        listEl.className = 'msg-bubble msg-ai';
        listEl.innerHTML = `<div style="font-weight:600;margin-bottom:8px;">Conversations (${convs.length})</div><pre style="font-size:11px;max-height:400px;overflow:auto;">${escapeHtml(formatJson(convs))}</pre>`;
        area.appendChild(listEl);
      }
      // Handle messages
      else if (state.activeEndpoint === 'messages') {
        const msgs = data.messages || data.data || data || [];
        const msgEl = document.createElement('div');
        msgEl.className = 'msg-bubble msg-ai';
        msgEl.style.maxWidth = '95%';
        let msgHtml = `<div style="font-weight:600;margin-bottom:8px;">Messages (${msgs.length})</div>`;
        msgs.forEach(m => {
          const role = m.role === 'user' ? 'You' : 'AI';
          const cls = m.role === 'user' ? 'color:var(--accent)' : 'color:var(--info)';
          msgHtml += `<div style="margin-bottom:8px;padding:8px;background:var(--bg-deep);border-radius:6px;border-left:3px solid ${m.role === 'user' ? 'var(--accent)' : 'var(--info)'};">
            <div style="font-size:11px;font-weight:700;${cls};margin-bottom:4px;">${role}</div>
            <div style="font-size:12px;color:var(--fg-muted);white-space:pre-wrap;word-break:break-word;">${escapeHtml((m.content || '').substring(0, 500))}${(m.content || '').length > 500 ? '...' : ''}</div>
          </div>`;
        });
        msgEl.innerHTML = msgHtml;
        area.appendChild(msgEl);
      }
      // Handle STT
      else if (state.activeEndpoint === 'stt') {
        const text = data.text || data.transcription || formatJson(data);
        const sttEl = document.createElement('div');
        sttEl.className = 'msg-bubble msg-ai';
        sttEl.innerHTML = `<div style="font-weight:600;margin-bottom:6px;"><i class="fa-solid fa-closed-captioning" style="color:var(--accent);"></i> Transcription</div><div style="font-size:14px;line-height:1.6;">${escapeHtml(text)}</div>`;
        area.appendChild(sttEl);
      }
      // Fallback JSON display
      else {
        const jsonEl = document.createElement('div');
        jsonEl.className = 'msg-bubble msg-ai';
        jsonEl.innerHTML = `<pre style="font-size:12px;max-height:500px;overflow:auto;">${escapeHtml(formatJson(data))}</pre>`;
        area.appendChild(jsonEl);
      }
    }

    renderRightContent('response');
    area.scrollTop = area.scrollHeight;

  } catch (err) {
    if (err.name === 'AbortError') {
      toast('Request cancelled', 'warning');
    } else {
      toast(`Request failed: ${err.message}`, 'error');
      const errEl = document.createElement('div');
      errEl.className = 'msg-bubble msg-ai';
      errEl.style.borderColor = 'var(--error)';
      errEl.innerHTML = `<div style="color:var(--error);font-weight:600;"><i class="fa-solid fa-times-circle"></i> ${escapeHtml(err.message)}</div>`;
      area.appendChild(errEl);
    }
    area.scrollTop = area.scrollHeight;
  } finally {
    state.loading = false;
    state.abortController = null;
    sendBtn.classList.remove('loading');
    sendBtn.querySelector('.btn-text').innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send';
  }
}

// ══════════════════════════════════════════
// SSE Stream Handler
// ══════════════════════════════════════════
async function handleSSEStream(resp, area) {
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let fullText = '';

  // Add typing indicator
  const typingEl = document.createElement('div');
  typingEl.className = 'typing-indicator';
  typingEl.innerHTML = '<span></span><span></span><span></span>';
  area.appendChild(typingEl);
  area.scrollTop = area.scrollHeight;

  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.substring(6).trim();
        if (payload === '[DONE]') {
          state.sseLog.push({ type: 'done', raw: '[DONE]' });
          continue;
        }

        try {
          const evt = JSON.parse(payload);
          state.sseLog.push({ type: evt.type || 'unknown', raw: payload });

          // Remove typing indicator on first real event
          if (typingEl.parentNode) {
            typingEl.remove();
          }

          switch (evt.type) {
            case 'text_delta': {
              if (!state.currentStreamBubble) {
                state.currentStreamBubble = document.createElement('div');
                state.currentStreamBubble.className = 'msg-bubble msg-ai cursor-blink';
                area.appendChild(state.currentStreamBubble);
              }
              state.currentStreamText += evt.content || '';
              state.currentStreamBubble.innerHTML = simpleMarkdown(state.currentStreamText);
              fullText = state.currentStreamText;
              area.scrollTop = area.scrollHeight;
              // Update SSE tab if active
              const activeTab = document.querySelector('.right-tab.active');
              if (activeTab && activeTab.dataset.tab === 'sse') renderRightContent('sse');
              break;
            }
            case 'search_results': {
              if (evt.html) {
                const searchEl = document.createElement('div');
                searchEl.className = 'msg-bubble msg-ai';
                searchEl.innerHTML = evt.html;
                area.insertBefore(searchEl, state.currentStreamBubble || null);
                area.scrollTop = area.scrollHeight;
              }
              break;
            }
            case 'image_generating': {
              // Show progress wrapper
              state.imageProgressWrap = document.createElement('div');
              state.imageProgressWrap.className = 'image-progress-wrap';
              state.imageProgressWrap.innerHTML = `
                <div class="image-progress-bar-track">
                  <div class="image-progress-bar-fill" id="imgProgressFill"></div>
                </div>
                <div class="image-progress-label" id="imgProgressLabel">Generating image...</div>
              `;
              area.appendChild(state.imageProgressWrap);
              area.scrollTop = area.scrollHeight;
              break;
            }
            case 'image_progress': {
              if (state.imageProgressWrap) {
                const fill = state.imageProgressWrap.querySelector('#imgProgressFill');
                const label = state.imageProgressWrap.querySelector('#imgProgressLabel');
                if (fill) fill.style.width = evt.progress + '%';
                if (label) label.textContent = `Rendering... ${evt.progress}%`;

                // Show progressive image
                let imgEl = state.imageProgressWrap.querySelector('img');
                if (!imgEl) {
                  imgEl = document.createElement('img');
                  imgEl.style.maxWidth = '256px';
                  imgEl.style.borderRadius = '6px';
                  imgEl.style.marginTop = '8px';
                  imgEl.style.display = 'block';
                  state.imageProgressWrap.appendChild(imgEl);
                }
                if (evt.data) imgEl.src = 'data:image/jpeg;base64,' + evt.data;
                area.scrollTop = area.scrollHeight;
              }
              break;
            }
            case 'image_generated': {
              // Replace progress with final image
              if (state.imageProgressWrap) {
                const imgEl = document.createElement('div');
                imgEl.className = 'msg-bubble msg-ai';
                imgEl.style.padding = '8px';
                const size = evt.size || '1024x1024';
                const quality = evt.quality || 'medium';
                imgEl.innerHTML = `
                  <div style="font-size:11px;color:var(--fg-dim);margin-bottom:6px;font-family:var(--mono);">Generated Image (${size}, ${quality})</div>
                  <img src="data:image/jpeg;base64,${evt.data}" style="max-width:100%;border-radius:8px;" alt="Generated image">
                `;
                state.imageProgressWrap.replaceWith(imgEl);
                state.imageProgressWrap = null;
                area.scrollTop = area.scrollHeight;
              }
              fullText = `[Generated image: ${evt.size || '?'}, ${evt.quality || '?'} quality]`;
              break;
            }
            case 'image_error': {
              if (state.imageProgressWrap) {
                state.imageProgressWrap.innerHTML = `<div style="color:var(--error);font-size:13px;"><i class="fa-solid fa-times-circle"></i> ${escapeHtml(evt.error || 'Image generation failed')}</div>`;
                state.imageProgressWrap = null;
              }
              fullText = `[Image error: ${evt.error || 'Unknown'}]`;
              break;
            }
            default: {
              // Unknown event — log it
              const unknownEl = document.createElement('div');
              unknownEl.className = 'msg-bubble msg-ai';
              unknownEl.style.fontSize = '12px';
              unknownEl.style.borderColor = 'var(--fg-dim)';
              unknownEl.innerHTML = `<div style="color:var(--fg-dim);font-weight:600;">Unknown Event: ${escapeHtml(evt.type || '?')}</div><pre style="font-size:11px;">${escapeHtml(payload)}</pre>`;
              area.appendChild(unknownEl);
              area.scrollTop = area.scrollHeight;
            }
          }
        } catch (parseErr) {
          // Malformed SSE — skip
          state.sseLog.push({ type: 'error', raw: payload });
        }
      }
    }
  } catch (err) {
    if (err.name !== 'AbortError') {
      toast('Stream error: ' + err.message, 'error');
    }
  } finally {
    // Remove typing indicator if still there
    if (typingEl.parentNode) typingEl.remove();
    // Remove cursor blink
    if (state.currentStreamBubble) {
      state.currentStreamBubble.classList.remove('cursor-blink');
    }
    state.rawResponse = fullText || '[No text response]';
    renderRightContent('response');
    renderRightContent('sse');
    area.scrollTop = area.scrollHeight;
  }
}

// ══════════════════════════════════════════
// New Chat shortcut
// ══════════════════════════════════════════
async function createNewChat() {
  if (!state.connected) { toast('Connect first', 'warning'); return; }

  const base = getBaseUrl();
  try {
    const resp = await fetch(base + '/newchat', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: 'Test Chat', remember: true })
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    const convId = data.conversation_id || data.id;
    if (convId) {
      state.activeConvId = convId;
      toast(`New chat: ${convId.substring(0, 8)}...`, 'success');
      loadConversations();
      updateRequestBar();
      // Clear response area
      document.getElementById('responseArea').innerHTML = `
        <div class="response-empty" id="emptyState">
          <i class="fa-solid fa-comments"></i>
          <p>New conversation ready. Select Chat endpoint and send a message.</p>
        </div>
      `;
    }
  } catch (e) {
    toast('Failed to create chat: ' + e.message, 'error');
  }
}

// ══════════════════════════════════════════
// Keyboard shortcut: Ctrl+Enter to send
// ══════════════════════════════════════════
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    sendRequest();
  }
  if (e.key === 'Escape' && state.loading) {
    if (state.abortController) state.abortController.abort();
  }
});
</script>
